name: R checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Run data-independent checks
        run: |
          Rscript tests/test_validation_splits.R
          Rscript tests/test_ridge_behavior.R
      - name: Parse analysis scripts
        run: Rscript -e 'invisible(lapply(list.files("R", pattern="\\.R$", full.names=TRUE), parse))'
