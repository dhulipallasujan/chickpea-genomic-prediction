name: R checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Syntax-check every script
        run: Rscript -e 'for (f in c(list.files("R", pattern = "[.]R$", full.names = TRUE), "run_genomic_prediction.R")) invisible(parse(f))'
      - name: Validation split and ridge helper tests
        run: Rscript tests/test_validation_splits.R
      - name: Ridge behaviour tests
        run: Rscript tests/test_ridge_behavior.R
